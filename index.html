<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>z80-workspace</title>
    <!--
      GoatCounter web analytics (privacy-friendly, cookie-less).
      แทนที่ YOURCODE ด้านล่างด้วย subdomain ที่ตั้งไว้ตอนสมัคร goatcounter.com
      (เช่น ถ้าสมัครได้ z80.goatcounter.com ให้ใช้ data-goatcounter="https://z80.goatcounter.com/count")
      เก็บสถิติเฉพาะเวอร์ชันเว็บ (GitHub Pages) — บน localhost/desktop จะไม่ส่งข้อมูล
    -->
    <script
      data-goatcounter="https://YOURCODE.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
